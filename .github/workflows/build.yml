name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # The sandbox integration tests compile and run real submissions inside
      # this image; without it they are skipped instead of exercised.
      - name: Build the submission sandbox image
        run: docker build -t codyngame-sandbox:latest sandbox/
      - name: Compile and test
        run: mvn -B -ntp verify
